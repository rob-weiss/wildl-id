name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Check web lockfile
        run: uv lock --project web --check
      - name: Run web tests
        run: uv run --project web --locked --extra test --python 3.14 python -m unittest discover -s tests -p 'test_web*.py'
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --locked --python 3.14
      - name: Check lockfile
        run: uv lock --check
      - name: Compile source and tests
        run: uv run --locked --python 3.14 python -m compileall -q src wildl_id.py tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run --locked --python 3.14 python -m unittest discover -s tests
