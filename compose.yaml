services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    user: "${HOST_UID:?Set HOST_UID to your numeric uid}:${HOST_GID:?Set HOST_GID to your numeric gid}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WILDL_ID_IMAGE_BASE_URL: ${WILDL_ID_IMAGE_BASE_URL:-}
    volumes:
      - ./labels:/app/labels:rw
      - ./labels/labels_MegaDetectorV6_MDV6-yolov10-e_classified/images:/app/labels/labels_MegaDetectorV6_MDV6-yolov10-e_classified/images:rw
      - ./images:/app/images:rw
      - ./logs:/app/logs:rw
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
