[project]
name = "wildlife"
version = "0.1.0"
requires-python = ">=3.10, <3.15"
dependencies = [
    "astral>=3.2",
    "easyocr>=1.7.2",
    "ephem>=4.2.1",
    "librosa>=0.11.0",
    "lightning>=2.6.6",
    "matplotlib>=3.10.9",
    "nicegui>=2.4.0",
    "numpy>=1.23.2",
    "omegaconf>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "python-dateutil>=2.9.0.post0",
    "pytorchwildlife>=1.3.0",
    "scikit-learn>=1.7.2",
    # Keep NumPy compatible with PyTorchWildlife's supervision pin on Python 3.10.
    "scipy<1.14 ; sys_platform == 'darwin' and python_full_version < '3.11'",
    "scipy>=1.14,<1.15 ; sys_platform == 'darwin' and python_full_version >= '3.11' and python_full_version < '3.14'",
    "scipy>=1.16 ; sys_platform == 'darwin' and python_full_version >= '3.14'",
    # EasyOCR needs a wheel-backed release on Python 3.14 instead of a Pythran source build.
    "scikit-image>=0.26.0 ; python_full_version >= '3.14'",
    "seaborn>=0.13.2",
    # PyTorch requires setuptools>=77; PyTorchWildlife's yolov5 requires pkg_resources.
    "setuptools>=77.0.3,<81",
    "soundfile>=0.14.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]
