[project]
name = "wildl-id-web"
version = "0.1.0"
description = "Local web application for wildl-id."
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "matplotlib>=3.10,<4.0",
    "nicegui>=3.18,<4.0",
    "piexif>=1.1.3",
    "pillow>=12.3",
    "tqdm>=4.70",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1.0", "httpx2>=2.0,<3.0"]

[tool.uv]
package = false
